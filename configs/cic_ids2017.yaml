# CIC-IDS2017 (cybersecurity). Format: 8 CSVs, one per weekday/session.
# Split is by date: Monday-Wednesday train, Thursday-Friday test.
# Needs cp1252 encoding (the Label column has an en-dash that isn't valid UTF-8).
name: cic-ids2017
format: csv_multi

paths:
  - data/raw/cic-ids2017/Monday-WorkingHours.pcap_ISCX.csv
  - data/raw/cic-ids2017/Tuesday-WorkingHours.pcap_ISCX.csv
  - data/raw/cic-ids2017/Wednesday-workingHours.pcap_ISCX.csv
  - data/raw/cic-ids2017/Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv
  - data/raw/cic-ids2017/Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv
  - data/raw/cic-ids2017/Friday-WorkingHours-Morning.pcap_ISCX.csv
  - data/raw/cic-ids2017/Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv
  - data/raw/cic-ids2017/Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv
encoding: cp1252

target: Label
time_column: Timestamp
group_column: Source IP

split:
  method: filename_group
  train_files: ["Monday", "Tuesday", "Wednesday"]
  test_files: ["Thursday", "Friday"]

# Flow ID is a composite string built from the 4-tuple (src ip, dst ip,
# src port, dst port) -- effectively unique per flow, a pure identifier.
# Destination IP is excluded for the same reason Source IP is the group
# column: an address identifies a host, not a generalizable flow pattern.
feature_exclude:
  - "Flow ID"
  - "Destination IP"

select:
  # Top-k by mutual information with the target, scored on train only.
  k: 25
  seed: 42

dev_limit:
  # Dev-mode cap: only read this many rows from the top of each file.
  # 20,000 rather than a smaller number because attacks don't start at the
  # top of a file -- Tuesday's first attack row is at index 11,347,  so a
  # smaller cap would give Stage 5's selection an all-BENIGN (zero-variance)
  # train target and nothing meaningful to rank. Set to null for a real run.
  max_rows_per_file: 20000
