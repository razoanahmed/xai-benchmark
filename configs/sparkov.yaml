# Sparkov (finance). Format: two CSVs, already pre-split by date by the
# dataset's creators (fraudTrain covers 2019-01-01..2020-06-21, fraudTest
# picks up right after). No re-splitting needed -- just use the two files.
name: sparkov
format: csv_pretabulated

train_path: data/raw/sparkov/fraudTrain.csv
test_path: data/raw/sparkov/fraudTest.csv

target: is_fraud
time_column: trans_date_trans_time
group_column: cc_num

split:
  method: pretabulated

clean:
  # Negatives get downsampled within train and within test independently,
  # each to this rate, so both sides carry enough fraud cases for SHAP/LIME
  # (capped at 200-500 explained rows) to have something to explain.
  target_positive_rate: 0.02
  seed: 42

dev_limit:
  # Dev-mode cap: only read this many rows from each of the two files.
  # 50,000 rather than a smaller number so the dev sample reliably contains
  # a handful of real fraud rows (fraud rate is ~0.4-0.6%) to downsample
  # against. Set to null for a real full-dataset run.
  max_rows_per_file: 50000
